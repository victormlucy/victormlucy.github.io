<!DOCTYPE html>

<!-- CODING LESSON NUMBER 1 -->
<!-- Commenting your code is vital, vital, vital -->

<!-- This is how you add comments to HTML -->

<!-- You can also include
multi - line comments
if you find that useful -->

<!-- To turn text into a comment, use the=is short-cut: CTRL & the "/" key (command + "/" on Mac)-->


<!-- HOW HTML WORKS - THE BASICS -->
<!-- HTML files have two fundamental parts. (1) The head, (2) The body -->

<!-- The head contains things that you do not see on the page -->

<head>
    <title>Victor Lucy</title>
</head>

<!-- The body contains thigs you see -->
<!-- Most elements both open and close, with the content in the middle -->
<!-- Indenting is optional, but helps with readability -->
<body>
    <h1>Victor Lucy</h1>
    <p>Welcome to my website!
    This page is currently under construction. For more information about me please visit my linkedin at https://www.linkedin.com/in/victorlucy </p>
</body>
</html>
